apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress-stack.fullname" . }}-mysql-secret
  namespace: default
type: Opaque
data:
  mysql-root-password: {{ .Values.mysql.rootPassword | b64enc | quote }}
  mysql-user: {{ .Values.mysql.user | b64enc | quote }}
  mysql-password: {{ .Values.mysql.password | b64enc | quote }}
  wordpress-db-user: {{ .Values.wordpress.dbUser | b64enc | quote }}
  wordpress-db-password: {{ .Values.wordpress.dbPassword | b64enc | quote }}
  wordpress-db-name: {{ .Values.wordpress.dbName | b64enc | quote }}
