apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress-stack.fullname" . }}-wordpress
spec:
  replicas: {{ .Values.wordpress.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "wordpress-stack.fullname" . }}-wordpress
  template:
    metadata:
      labels:
        app: {{ include "wordpress-stack.fullname" . }}-wordpress
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ .Values.wordpress.dbHost }}
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress-stack.fullname" . }}-mysql-secret
                  key: wordpress-db-user
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress-stack.fullname" . }}-mysql-secret
                  key: wordpress-db-password
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress-stack.fullname" . }}-mysql-secret
                  key: wordpress-db-name
          ports:
            - containerPort: {{ .Values.wordpress.service.port }}
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-persistent-storage
          persistentVolumeClaim:
            claimName: {{ include "wordpress-stack.fullname" . }}-pvc
